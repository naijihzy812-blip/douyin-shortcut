<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>添加 抖音无水印</title>
<style>
/* Layout: one centered column sized for a phone; a big primary action, fallback below it */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --fg:#1C1C1E; --muted:#6C6C70; --line:#E3E3E8;
  --accent:#0A5BD3; --accent-fg:#FFFFFF; --tile-a:#2C6BF2; --tile-b:#7A3CF0;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#000000; --card:#1C1C1E; --fg:#F2F2F7; --muted:#9A9AA1; --line:#38383A;
  --accent:#3D8BFF; --accent-fg:#FFFFFF; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;
  padding:calc(env(safe-area-inset-top,0px) + 40px) 20px calc(env(safe-area-inset-bottom,0px) + 40px)}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.head{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.tile{width:84px;height:84px;border-radius:20px;background:linear-gradient(145deg,var(--tile-a),var(--tile-b));
  display:grid;place-items:center;box-shadow:0 8px 24px rgba(60,60,140,.25)}
.tile svg{width:44px;height:44px}
h1{font-size:26px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0;font-size:14px}
.status{text-align:center;font-size:14px;color:var(--muted);min-height:1.5em;margin:0}
.btn{display:block;text-align:center;text-decoration:none;font-size:18px;font-weight:600;padding:16px;border-radius:14px}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.secondary{background:var(--card);color:var(--accent);font-size:16px;padding:14px}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.card{background:var(--card);border-radius:12px;padding:14px 16px}
.card h2{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.05em;margin:0 0 6px}
.card ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.card p{margin:0}
.hl{outline:2px solid var(--accent);outline-offset:2px}
#desk{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
#qr{background:#fff;padding:12px;border-radius:12px}
#addr{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:var(--muted);word-break:break-all}
footer{text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<main>
  <div class="head">
    <div class="tile" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M24 9v20M16 21l8 8 8-8"/><path d="M11 35h26"/>
      </svg>
    </div>
    <h1>抖音无水印</h1>
    <p class="sub">复制抖音分享链接，一键把无水印视频存进相册</p>
  </div>

  <section id="ios" hidden>
    <div style="display:flex;flex-direction:column;gap:12px">
      <p class="status" id="status">正在打开“快捷指令”…</p>
      <a class="btn primary" id="go" href="#">添加到快捷指令</a>
      <a class="btn secondary" id="dl" href="#">没反应？下载文件添加</a>
    </div>
  </section>

  <section id="desk" hidden>
    <p class="sub">请用 iPhone 相机扫码打开本页</p>
    <div id="qr"></div>
    <p id="addr"></p>
  </section>

  <div class="card" id="fallback">
    <h2>点“下载文件添加”之后</h2>
    <ol>
      <li>弹窗里选 <b>下载</b>。</li>
      <li>点 Safari 地址栏左边的 <b>下载图标</b>，再点 <b>抖音无水印.shortcut</b>。</li>
      <li>跳到“快捷指令”后，点 <b>添加快捷指令</b>。</li>
    </ol>
  </div>

  <div class="card">
    <h2>怎么用</h2>
    <p>在抖音里点 <b>分享 → 复制链接</b>，然后运行“抖音无水印”，或者直接在分享菜单里选它。第一次运行弹出的权限提示，都选 <b>始终允许</b>。</p>
  </div>

  <footer>仅供个人保存使用，请尊重原作者版权</footer>
</main>

<script>
(function(){
  var NAME = '抖音无水印';
  var file = new URL(NAME + '.shortcut', location.href).href;
  var scheme = 'shortcuts://import-shortcut?url=' + encodeURIComponent(file) + '&name=' + encodeURIComponent(NAME);
  var ua = navigator.userAgent;
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (isIOS) {
    var ios = document.getElementById('ios');
    var go = document.getElementById('go');
    var dl = document.getElementById('dl');
    var status = document.getElementById('status');
    ios.hidden = false;
    go.href = scheme;
    dl.href = file;
    dl.setAttribute('download', NAME + '.shortcut');

    var left = false;
    document.addEventListener('visibilitychange', function(){ if (document.hidden) left = true; });
    setTimeout(function(){ location.href = scheme; }, 500);
    setTimeout(function(){
      if (!left) {
        status.textContent = '没有自动跳转的话，点下面的按钮';
        document.getElementById('fallback').classList.add('hl');
      } else {
        status.textContent = '已打开“快捷指令”，点“添加快捷指令”即可';
      }
    }, 3000);
  } else {
    document.getElementById('desk').hidden = false;
    document.getElementById('fallback').hidden = true;
    document.getElementById('addr').textContent = location.href;
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    s.onload = function(){ new QRCode(document.getElementById('qr'), {text: location.href, width: 220, height: 220}); };
    document.head.appendChild(s);
  }
})();
</script>
</body>
</html>
